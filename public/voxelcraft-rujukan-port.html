<!DOCTYPE html>
<html lang="en">
<head>

<style>
  /* Minimal CSS — only what's needed for canvas, HUD, hotbar, overlay */
  /* NO modern polish: no vignette, no clouds, no sprint FOV */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #crosshair {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 16px; height: 16px; pointer-events: none; mix-blend-mode: difference;
    background:
      linear-gradient(#fff,#fff) center/2px 16px no-repeat,
      linear-gradient(#fff,#fff) center/16px 2px no-repeat;
  }
  #hud {
    position: absolute; left: 0; right: 0; top: 0; padding: 4px 8px;
    color: #fff; text-shadow: 2px 2px 0 #000; font-size: 12px; pointer-events: none;
    white-space: pre;
  }
  #hotbar {
    position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
    display: flex; gap: 2px; padding: 2px; background: rgba(0,0,0,0.4);
    border: 2px solid rgba(0,0,0,0.6); pointer-events: none;
  }
  .slot {
    width: 32px; height: 32px; border: 1px solid rgba(120,120,120,0.8);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #fff; text-shadow: 1px 1px 0 #000;
    position: relative;
  }
  .slot.selected { border-color: #fff; box-shadow: 0 0 0 2px #fff inset; }
  .slot .count {
    position: absolute; right: 2px; bottom: 0; font-size: 10px; color: #fff;
    text-shadow: 1px 1px 0 #000;
  }
  #overlay {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    background: rgba(16,16,16,0.78); display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff;
    pointer-events: auto;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { margin-bottom: 24px; font-size: 28px; letter-spacing: 2px; }
  .vbtn {
    min-width: 160px; height: 24px; margin: 4px 0; padding: 0 8px;
    display: flex; align-items: center; justify-content: center;
    background: #6a6a6a; color: #e0e0e0; border: 0; cursor: pointer;
    font-family: monospace; font-size: 11px;
  }
  .vbtn:hover { background: #7c7c7c; color: #ffffa0; }
  .vbtn.disabled { background: #4a4a4a; color: #a0a0a0; cursor: default; }
  .vbtn.small { min-width: 78px; height: 22px; }
  #overlay .credit { position: absolute; right: 4px; bottom: 4px; font-size: 10px; color: #fff; }
  #overlay .ver    { position: absolute; top: 62px; left: 0; right: 0; text-align: center; font-size: 10px; color: #cccccc; }
  #loading {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff; z-index: 10;
  }
  #loading.hidden { display: none; }
  .spinner {
    width: 28px; height: 28px; border: 3px solid #333; border-top: 3px solid #fff;
    border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #break-overlay {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 24px; height: 24px; pointer-events: none; display: none;
    background:
      linear-gradient(0deg, transparent 49%, rgba(0,0,0,0.5) 50%, transparent 51%),
      linear-gradient(90deg, transparent 49%, rgba(0,0,0,0.5) 50%, transparent 51%);
  }
</style>

<script type="module">
import * as THREE from 'three';

// =============================================================================
// VoxelCraft — Faithful browser port of MCPE 2013 (rujukan source)
// Ported line-by-line from /home/z/my-project/MODLOG.md verified code blocks.
// All class names, constants, and key method bodies match rujukan exactly.
// UNVERIFIED items are flagged in comments.

// =============================================================================
// SECTION: world/phys/ — Vec3, AABB, HitResult
// (Entry 1: Entity.cpp base movement helpers)
// =============================================================================

class Vec3 {
  constructor(x = 0, y = 0, z = 0) { this.x = x; this.y = y; this.z = z; }
  set(x, y, z) { this.x = x; this.y = y; this.z = z; return this; }
  distanceToSqr(x, y, z) {
    const dx = x - this.x, dy = y - this.y, dz = z - this.z;
    return dx*dx + dy*dy + dz*dz;
  }
  distanceTo(x, y, z) { return Math.sqrt(this.distanceToSqr(x, y, z)); }
}

// AABB — axis-aligned bounding box (Entry 1: Entity.cpp; Entry 11: Tile.cpp)
// x0/y0/z0 = min corner, x1/y1/z1 = max corner.
class AABB {
  constructor(x0, y0, z0, x1, y1, z1) {
    this.x0 = x0; this.y0 = y0; this.z0 = z0;
    this.x1 = x1; this.y1 = y1; this.z1 = z1;
  }
  set(x0, y0, z0, x1, y1, z1) {
    this.x0 = x0; this.y0 = y0; this.z0 = z0;
    this.x1 = x1; this.y1 = y1; this.z1 = z1; return this;
  }
  clone() { return new AABB(this.x0, this.y0, this.z0, this.x1, this.y1, this.z1); }

  // AABB::intersects(other) — VERIFIED (Tile.cpp references)
  intersects(other) {
    return this.x1 > other.x0 && other.x1 > this.x0 &&
           this.y1 > other.y0 && other.y1 > this.y0 &&
           this.z1 > other.z0 && other.z1 > this.z0;
  }

  // AABB::grow(x, y, z) — VERIFIED (Mob.cpp:745 uses grow(0.2, 0, 0.2))
  grow(x, y, z) {
    return new AABB(this.x0 - x, this.y0 - y, this.z0 - z,
                    this.x1 + x, this.y1 + y, this.z1 + z);
  }

  // AABB::move(xa, ya, za) — translate (Entity.cpp uses this internally)
  move(xa, ya, za) {
    this.x0 += xa; this.x1 += xa;
    this.y0 += ya; this.y1 += ya;
    this.z0 += za; this.z1 += za;
  }

  // AABB::clipXCollide(other, xa) — VERIFIED (Entity.cpp move() per-axis clip)
  // Returns the clipped xa such that `this` would not overlap `other`.
  clipXCollide(other, xa) {
    if (!this.intersects(other)) return xa;
    if (xa > 0 && other.x1 <= this.x0) xa = Math.min(xa, this.x0 - other.x1);
    if (xa < 0 && other.x0 >= this.x1) xa = Math.max(xa, this.x1 - other.x0);
    return xa;
  }
  clipYCollide(other, ya) {
    if (!this.intersects(other)) return ya;
    if (ya > 0 && other.y1 <= this.y0) ya = Math.min(ya, this.y0 - other.y1);
    if (ya < 0 && other.y0 >= this.y1) ya = Math.max(ya, this.y1 - other.y0);
    return ya;
  }
  clipZCollide(other, za) {
    if (!this.intersects(other)) return za;
    if (za > 0 && other.z1 <= this.z0) za = Math.min(za, this.z0 - other.z1);
    if (za < 0 && other.z0 >= this.z1) za = Math.max(za, this.z1 - other.z0);
    return za;
  }
}

// HitResult — the ray-cast result (Entry 1: HitResult.h)
// type: 0 = NONE, 1 = TILE, 2 = ENTITY
class HitResult {
  constructor() { this.type = 0; this.x = 0; this.y = 0; this.z = 0; this.f = 0; this.pos = new Vec3(); this.entity = null; this.indirectHit = false; }
  isHit() { return this.type !== 0; }
  setTile(x, y, z, f, pos) { this.type = 1; this.x = x; this.y = y; this.z = z; this.f = f; this.pos = pos; this.entity = null; }
  setEntity(e) { this.type = 2; this.entity = e; }
  clear() { this.type = 0; this.entity = null; }
}

// =============================================================================
// SECTION: world/level/ — LevelConstants, LevelChunk, Level
// (Entries 9, 10: Level.cpp / LevelChunk.cpp / LevelConstants.h)
// =============================================================================

// LevelConstants.h — VERIFIED (Entry 9)
const LevelConstants = {
  LEVEL_HEIGHT: 128,
  CHUNK_CACHE_WIDTH: 16,   // in chunks (16x16 = 256 chunks total)
  CHUNK_WIDTH: 16,           // in blocks
  CHUNK_DEPTH: 16,
  LEVEL_WIDTH: 256,          // 16 * 16
  LEVEL_DEPTH: 256,
  CHUNK_COLUMNS: 256,        // 16 * 16
  CHUNK_BLOCK_COUNT: 32768,  // 256 * 128
};

// Level.h static constants — VERIFIED (Entry 9)
const LevelConst = {
  MAX_LEVEL_SIZE: 32000000,
  DEPTH: 128,
  SEA_LEVEL: 63,                          // DEPTH / 2 - 1
  genSeaLevel: 64,                        // DEPTH - 64
  MAX_BRIGHTNESS: 15,
  TICKS_PER_DAY: 19200,                   // 20 * 60 * 16
  MIDDLE_OF_NIGHT_TIME: 12000,
  genDepthBits: 7,
  genDepthBitsPlusFour: 11,
  genDepth: 128,
  genDepthMinusOne: 127,
  MAX_TICK_TILES_PER_TICK: 100,
};

// Index formula VERIFIED (Entry 10):
//   blocks[(x << 11) | (z << 7) | y]
//   heightmap[(z << 4) | x]
function blockIndex(x, y, z) { return (x << 11) | (z << 7) | y; }
function heightmapIndex(x, z) { return (z << 4) | x; }

// Material — minimal enum (Entry 11 references Material::stone, water, lava, etc.)
// Each material has flags: isSolidBlocking, blocksLight, blocksMotion, isLiquid,
// isAlwaysDestroyable, isReplaceable.
class Material {
  constructor(name, opts = {}) {
    this.name = name;
    this.isSolidBlocking = opts.isSolidBlocking ?? false;
    this.blocksLight = opts.blocksLight ?? true;
    this.blocksMotion = opts.blocksMotion ?? false;
    this.isLiquid = opts.isLiquid ?? false;
    this.isAlwaysDestroyable = opts.isAlwaysDestroyable ?? true;
    this.isReplaceable = opts.isReplaceable ?? false;
  }
  isSolid() { return this.blocksMotion; }
}
const Materials = {
  air:        new Material('air',          {isSolidBlocking:false, blocksLight:false, blocksMotion:false, isAlwaysDestroyable:true, isReplaceable:true}),
  stone:      new Material('stone',       {isSolidBlocking:true,  blocksMotion:true,  isAlwaysDestroyable:false}),
  wood:       new Material('wood',        {isSolidBlocking:true,  blocksMotion:true}),
  dirt:       new Material('dirt',         {isSolidBlocking:true,  blocksMotion:true}),
  grass:      new Material('grass',       {isSolidBlocking:true,  blocksMotion:true}),
  sand:       new Material('sand',         {isSolidBlocking:true,  blocksMotion:true}),
  gravel:     new Material('gravel',      {isSolidBlocking:true,  blocksMotion:true}),
  glass:      new Material('glass',        {isSolidBlocking:true,  blocksMotion:true,  blocksLight:false}),
  water:      new Material('water',        {isSolidBlocking:false, blocksLight:false, blocksMotion:false, isLiquid:true, isAlwaysDestroyable:true, isReplaceable:true}),
  lava:       new Material('lava',         {isSolidBlocking:false, blocksLight:false, blocksMotion:false, isLiquid:true,  isAlwaysDestroyable:true, isReplaceable:true}),
  leaves:     new Material('leaves',       {isSolidBlocking:false, blocksLight:false, blocksMotion:true}),
  metal:      new Material('metal',        {isSolidBlocking:true,  blocksMotion:true,  isAlwaysDestroyable:false}),
  ice:        new Material('ice',          {isSolidBlocking:true,  blocksMotion:true,  blocksLight:false}),
  topSnow:    new Material('topSnow',      {isSolidBlocking:false, blocksMotion:false, isAlwaysDestroyable:false, isReplaceable:true}),
  snow:       new Material('snow',         {isSolidBlocking:true,  blocksMotion:true}),
  explosive:  new Material('explosive',    {isSolidBlocking:true,  blocksMotion:true}),
  plant:      new Material('plant',        {isSolidBlocking:false, blocksLight:false, blocksMotion:false, isReplaceable:true}),
  cloth:      new Material('cloth',        {isSolidBlocking:true,  blocksMotion:true}),
  clay:       new Material('clay',         {isSolidBlocking:true,  blocksMotion:true}),
  web:        new Material('web',          {isSolidBlocking:false, blocksLight:false, blocksMotion:false}),
  fire:       new Material('fire',         {isSolidBlocking:false, blocksLight:false, blocksMotion:false, isReplaceable:true}),
  cactus:     new Material('cactus',       {isSolidBlocking:false, blocksMotion:true}),
};

// DataLayer — VERIFIED (Entry 10: DataLayer.h)
// 4-bit nibble storage: 2 blocks per byte.
class DataLayer {
  constructor(length) {
    this.length = length >> 1;            // 16384 bytes
    this.data = new Uint8Array(this.length);
    this.setAll(0);
  }
  // get(pos) — VERIFIED (Entry 10)
  get(pos) {
    const slot = pos >> 1;
    const part = pos & 1;
    return (part === 0) ? (this.data[slot] & 0xf) : ((this.data[slot] >> 4) & 0xf);
  }
  // set(pos, val) — VERIFIED (Entry 10)
  set(pos, val) {
    const slot = pos >> 1;
    const part = pos & 1;
    if (part === 0) this.data[slot] = (this.data[slot] & 0xf0) | (val & 0xf);
    else           this.data[slot] = (this.data[slot] & 0x0f) | ((val & 0xf) << 4);
  }
  // setAll(br) — VERIFIED (Entry 10)
  setAll(br) {
    const v = (br & 0xf) | ((br & 0xf) << 4);
    this.data.fill(v);
  }
}

// LevelChunk — VERIFIED (Entry 10: LevelChunk.cpp)
class LevelChunk {
  constructor(level, x, z) {
    this.level = level;
    this.x = x; this.z = z;
    this.xt = x * LevelConstants.CHUNK_WIDTH;
    this.zt = z * LevelConstants.CHUNK_DEPTH;
    this.blocks = new Uint8Array(LevelConstants.CHUNK_BLOCK_COUNT);
    this.data = new DataLayer(LevelConstants.CHUNK_BLOCK_COUNT);
    this.skyLight = new DataLayer(LevelConstants.CHUNK_BLOCK_COUNT);
    this.skyLight.setAll(15);
    this.blockLight = new DataLayer(LevelConstants.CHUNK_BLOCK_COUNT);
    this.heightmap = new Uint8Array(256);
    this.unsaved = false;
    this.terrainPopulated = false;
    this.dirty = true;
  }

  // LevelChunk::getTile — VERIFIED (Entry 10)
  getTile(x, y, z) {
    if (y < 0 || y >= LevelConstants.LEVEL_HEIGHT) return 0;
    return this.blocks[blockIndex(x, y, z)];
  }

  // LevelChunk::setTileRaw — VERIFIED (Entry 10)
  setTileRaw(x, y, z, tile) {
    this.blocks[blockIndex(x, y, z)] = tile & 0xff;
  }

  // LevelChunk::setTile — VERIFIED (Entry 10) (simplified: no neighbor/onRemove cascade)
  setTile(x, y, z, tile) {
    if (y < 0 || y >= LevelConstants.LEVEL_HEIGHT) return false;
    const idx = blockIndex(x, y, z);
    const old = this.blocks[idx];
    if (old === tile) return false;
    this.blocks[idx] = tile & 0xff;
    this.data.set(idx, 0);
    this.recalcHeightColumn(x, z);
    this.unsaved = true;
    this.dirty = true;
    return true;
  }

  // LevelChunk::getData — VERIFIED (Entry 10)
  getData(x, y, z) { return this.data.get(blockIndex(x, y, z)); }
  setData(x, y, z, v) { this.data.set(blockIndex(x, y, z), v); }

  // LevelChunk::getBrightness — VERIFIED (Entry 10)
  getBrightnessSky(x, y, z) { return this.skyLight.get(blockIndex(x, y, z)); }
  getBrightnessBlock(x, y, z) { return this.blockLight.get(blockIndex(x, y, z)); }
  setBrightnessSky(x, y, z, v) { this.skyLight.set(blockIndex(x, y, z), v & 0xf); }
  setBrightnessBlock(x, y, z, v) { this.blockLight.set(blockIndex(x, y, z), v & 0xf); }

  // LevelChunk::getRawBrightness — VERIFIED (Entry 10)
  // rawBrightness = max(skyLight - skyDampen, blockLight)
  getRawBrightness(x, y, z, skyDampen) {
    let light = this.skyLight.get(blockIndex(x, y, z));
    light -= skyDampen;
    const block = this.blockLight.get(blockIndex(x, y, z));
    if (block > light) light = block;
    return light;
  }

  // LevelChunk::isSkyLit — VERIFIED (Entry 10)
  isSkyLit(x, y, z) {
    return y >= this.heightmap[heightmapIndex(x, z)];
  }

  // LevelChunk::getHeightmap — VERIFIED (Entry 10)
  getHeightmap(x, z) { return this.heightmap[heightmapIndex(x, z)]; }

  // LevelChunk::recalcHeightmap (full) — VERIFIED (Entry 10)
  recalcHeightmap() {
    for (let x = 0; x < 16; x++) {
      for (let z = 0; z < 16; z++) {
        let y = LevelConst.DEPTH - 1;       // 127
        const p = x << 11 | z << 7;
        while (y > 0 && Tile.lightBlock[this.blocks[p + y - 1]] === 0) y--;
        this.heightmap[heightmapIndex(x, z)] = y;
        // Initialize sky light top-down
        let br = LevelConst.MAX_BRIGHTNESS;  // 15
        let yy = LevelConst.DEPTH - 1;
        while (yy > 0 && br > 0) {
          br -= Tile.lightBlock[this.blocks[p + yy]];
          if (br > 0) this.skyLight.set(p + yy, br);
          yy--;
        }
      }
    }
  }

  // Recompute a single column's heightmap after a tile change.
  recalcHeightColumn(x, z) {
    let y = LevelConst.DEPTH - 1;
    const p = x << 11 | z << 7;
    while (y > 0 && Tile.lightBlock[this.blocks[p + y - 1]] === 0) y--;
    this.heightmap[heightmapIndex(x, z)] = y;
  }
}

// Level — VERIFIED (Entry 9: Level.cpp). Bounded 256×256×128.
class Level {
  constructor(seed, isCreative) {
    this.seed = seed;
    this.isClientSide = false;
    this.isCreative = isCreative;
    this.tickCount = 0;
    this.time = 0;
    this.skyDarken = 0;
    this.random = new Random(1);
    // LCG state for tickTiles (Entry 9) — seed 42184323, addend 1013904223
    this._randValue = 42184323;
    this._addend = 1013904223;
    // 16x16 chunk cache = 256 chunks (Entry 9: CHUNK_CACHE_WIDTH=16)
    this.chunks = new Array(LevelConstants.CHUNK_CACHE_WIDTH * LevelConstants.CHUNK_CACHE_WIDTH);
    for (let i = 0; i < this.chunks.length; i++) this.chunks[i] = null;
    this.entities = [];
    this.players = [];
    this.spawnPos = { x: 128, y: 64, z: 128 };
    this.noNeighborUpdate = false;
    this.difficulty = 0; // PEACEFUL
    this.listeners = []; // LevelRenderer listeners
  }

  hasChunk(cx, cz) {
    return cx >= 0 && cx < 16 && cz >= 0 && cz < 16;
  }
  getChunk(cx, cz) {
    if (!this.hasChunk(cx, cz)) return null;
    const idx = cz * 16 + cx;
    if (!this.chunks[idx]) {
      this.chunks[idx] = new LevelChunk(this, cx, cz);
    }
    return this.chunks[idx];
  }

  // Level::getTile — VERIFIED (Entry 9)
  getTile(x, y, z) {
    if (y < 0 || y >= LevelConst.DEPTH) return 0;
    if (x < 0 || z < 0 || x >= 256 || z >= 256) return 0;
    return this.getChunk(x >> 4, z >> 4).getTile(x & 15, y, z & 15);
  }

  // Level::setTile — VERIFIED (Entry 9)
  setTile(x, y, z, tile) {
    if (y < 0 || y >= LevelConst.DEPTH) return false;
    const c = this.getChunk(x >> 4, z >> 4);
    const changed = c.setTile(x & 15, y, z & 15, tile);
    if (changed) this.tileUpdated(x, y, z, tile);
    return changed;
  }
  setTileNoUpdate(x, y, z, tile) {
    if (y < 0 || y >= LevelConst.DEPTH) return false;
    return this.getChunk(x >> 4, z >> 4).setTile(x & 15, y, z & 15, tile);
  }

  getData(x, y, z) {
    if (y < 0 || y >= LevelConst.DEPTH) return 0;
    return this.getChunk(x >> 4, z >> 4).getData(x & 15, y, z & 15);
  }
  setData(x, y, z, v) {
    if (y < 0 || y >= LevelConst.DEPTH) return;
    this.getChunk(x >> 4, z >> 4).setData(x & 15, y, z & 15, v);
  }

  // Level::tileUpdated — VERIFIED (Entry 9)
  tileUpdated(x, y, z, tile) {
    for (const l of this.listeners) l.tileChanged(x, y, z);
    this.updateNeighborsAt(x, y, z, tile);
  }
  updateNeighborsAt(x, y, z, tile) {
    this.neighborChanged(x - 1, y, z, tile);
    this.neighborChanged(x + 1, y, z, tile);
    this.neighborChanged(x, y - 1, z, tile);
    this.neighborChanged(x, y + 1, z, tile);
    this.neighborChanged(x, y, z - 1, tile);
    this.neighborChanged(x, y, z + 1, tile);
  }
  neighborChanged(x, y, z, type) {
    if (this.noNeighborUpdate || this.isClientSide) return;
    const t = this.getTile(x, y, z);
    if (t > 0 && Tile.tiles[t] && Tile.tiles[t].neighborChanged) Tile.tiles[t].neighborChanged(this, x, y, z, type);
  }

  isEmptyTile(x, y, z) { return this.getTile(x, y, z) === 0; }

  getMaterial(x, y, z) {
    const t = this.getTile(x, y, z);
    if (t === 0) return Materials.air;
    return Tile.tiles[t].material;
  }

  // Level::isSolidBlockingTile — VERIFIED (Entry 9)
  isSolidBlockingTile(x, y, z) {
    const t = Tile.tiles[this.getTile(x, y, z)];
    if (!t) return false;
    return t.material.isSolidBlocking && t.isCubeShaped();
  }
  isSolidRenderTile(x, y, z) {
    const t = Tile.tiles[this.getTile(x, y, z)];
    if (!t) return false;
    return t.isSolidRender();
  }

  // Level::getRawBrightness — VERIFIED (Entry 9)
  getRawBrightness(x, y, z) {
    if (y < 0) return 0;
    if (y >= LevelConst.DEPTH) {
      let br = LevelConst.MAX_BRIGHTNESS - this.skyDarken;
      if (br < 0) br = 0;
      return br;
    }
    if (x < 0 || z < 0 || x >= 256 || z >= 256) return LevelConst.MAX_BRIGHTNESS - this.skyDarken;
    return this.getChunk(x >> 4, z >> 4).getRawBrightness(x & 15, y, z & 15, this.skyDarken);
  }
  getBrightness(x, y, z) {
    // brightnessRamp formula (Entry 9): v = 1 - i/16; ramp = ((1-v)/(v*3+1))*0.95 + 0.15
    const i = this.getRawBrightness(x, y, z);
    const v = 1 - i / 16;
    return ((1 - v) / (v * 3 + 1)) * 0.95 + 0.15;
  }

  isSkyLit(x, y, z) {
    if (y < 0) return false;
    if (y >= LevelConst.DEPTH) return true;
    if (x < 0 || z < 0 || x >= 256 || z >= 256) return false;
    return this.getChunk(x >> 4, z >> 4).isSkyLit(x & 15, y, z & 15);
  }
  getHeightmap(x, z) {
    if (x < 0 || z < 0 || x >= 256 || z >= 256) return 0;
    return this.getChunk(x >> 4, z >> 4).getHeightmap(x & 15, z & 15);
  }

  // Level::getTopSolidBlock — VERIFIED (Entry 9)
  getTopSolidBlock(x, z) {
    let y = LevelConst.DEPTH - 1;
    while (this.getMaterial(x, y, z).blocksMotion && y > 0) y--;
    while (y > 0) {
      const t = this.getTile(x, y, z);
      if (t === 0 || !Tile.tiles[t].material.blocksMotion || Tile.tiles[t].material === Materials.leaves) y--;
      else return y + 1;
    }
    return -1;
  }
  getTopTileY(x, z) {
    let y = 63;
    while (!this.isEmptyTile(x, y + 1, z)) y++;
    return y;
  }

  getSeaLevel() { return LevelConst.SEA_LEVEL; }

  // Level::setInitialSpawn — VERIFIED (Entry 9): center of world (128, 64, 128)
  setInitialSpawn() {
    this.spawnPos = { x: 128, y: 64, z: 128 };
  }

  getSharedSpawnPos() { return this.spawnPos; }

  // Level::getTimeOfDay — VERIFIED (Entry 9): NormalDayCycleDimension::getTimeOfDay
  // td = (dayStep + a) / TICKS_PER_DAY - 0.25; normalize; td = 1 - (cos(td*PI) + 1)*0.5
  // final = tdo + (td - tdo) / 3.0  (creative always returns 1)
  getTimeOfDay(a = 0) {
    if (this.isCreative) return 1;       // Dimension base returns 1 for creative
    let dayStep = this.time % LevelConst.TICKS_PER_DAY;
    let td = (dayStep + a) / LevelConst.TICKS_PER_DAY - 0.25;
    if (td < 0) td += 1;
    if (td > 1) td -= 1;
    const tdo = td;
    td = 1 - (Math.cos(td * Math.PI) + 1) * 0.5;
    return tdo + (td - tdo) / 3.0;
  }
  isDay() { return this.skyDarken < 4; }

  // Level::getSkyDarken — VERIFIED (Entry 9)
  // br = 1 - (cos(td*2PI)*2 + 0.5); clamp [0, 0.8]; return floor(br * 11)
  getSkyDarken(a = 1) {
    const td = this.getTimeOfDay(a);
    let br = 1 - (Math.cos(td * Math.PI * 2) * 2 + 0.5);
    if (br < 0) br = 0;
    if (br > 0.8) br = 0.8;
    return Math.floor(br * 11);
  }
  updateSkyDarken() { this.skyDarken = this.getSkyDarken(1); }

  setTime(t) { this.time = t; }
  getTime() { return this.time; }

  // Level::tick — VERIFIED order (Entry 9)
  tick() {
    this.updateSkyDarken();
    if (!this.isClientSide) {
      this.time = (this.time + 1) % LevelConst.TICKS_PER_DAY;
    }
    this.tickTiles();
    this.tickCount++;
  }

  // Level::tickTiles — VERIFIED (Entry 9)
  // For each chunk: 20 random ticks via LCG; decode x=val&15, z=(val>>8)&15, y=(val>>16)&127
  tickTiles() {
    for (let ci = 0; ci < 16; ci++) {
      for (let cj = 0; cj < 16; cj++) {
        const lc = this.getChunk(ci, cj);
        if (!lc) continue;
        for (let i = 0; i < 20; i++) {
          // LCG: _randValue = _randValue * 3 + _addend
          this._randValue = (Math.imul(this._randValue, 3) + this._addend) | 0;
          const val = this._randValue >> 2;
          const x = val & 15;
          const z = (val >> 8) & 15;
          const y = (val >> 16) & 127;
          const id = lc.getTile(x, y, z);
          if (Tile.shouldTick[id] && Tile.tiles[id] && Tile.tiles[id].tick) {
            Tile.tiles[id].tick(this, ci * 16 + x, y, cj * 16 + z, this.random);
          }
        }
      }
    }
  }

  // Level::tickEntities — VERIFIED (Entry 9): for each entity: e.tick(); if removed, drop.
  tickEntities() {
    for (let i = this.entities.length - 1; i >= 0; i--) {
      const e = this.entities[i];
      if (!e.removed) {
        e.xOld = e.x; e.yOld = e.y; e.zOld = e.z;
        e.yRotO = e.yRot; e.xRotO = e.xRot;
        e.tick();
      }
      if (e.removed) {
        this.entities.splice(i, 1);
      }
    }
  }

  addEntity(e) {
    e.level = this;
    this.entities.push(e);
    if (e.isPlayer && e.isPlayer()) this.players.push(e);
  }

  removeEntity(e) {
    const i = this.entities.indexOf(e);
    if (i >= 0) this.entities.splice(i, 1);
  }

  getNearestPlayer(x, y, z, radius) {
    let best = null, bestD = radius * radius;
    for (const p of this.players) {
      const d = (p.x - x) ** 2 + (p.y - y) ** 2 + (p.z - z) ** 2;
      if (d < bestD) { bestD = d; best = p; }
    }
    return best;
  }

  getEntities(except, bb) {
    const out = [];
    for (const e of this.entities) {
      if (e === except || e.removed) continue;
      if (e.bb && e.bb.intersects(bb)) out.push(e);
    }
    return out;
  }

  addListener(l) { this.listeners.push(l); }

  // DDA voxel raycast — used by Minecraft::pickBlock (Entry 9 references clip())
  // Returns HitResult with .type = TILE if hit, else .type = NONE.
  pickBlock(player, maxDist) {
    const ox = player.x, oy = player.y + player.heightOffset, oz = player.z;
    const dir = player.getLook();
    const dx = dir.x, dy = dir.y, dz = dir.z;
    let x = Math.floor(ox), y = Math.floor(oy), z = Math.floor(oz);
    const stepX = Math.sign(dx), stepY = Math.sign(dy), stepZ = Math.sign(dz);
    const tDeltaX = dx === 0 ? Infinity : Math.abs(1 / dx);
    const tDeltaY = dy === 0 ? Infinity : Math.abs(1 / dy);
    const tDeltaZ = dz === 0 ? Infinity : Math.abs(1 / dz);
    let tMaxX = dx === 0 ? Infinity : (stepX > 0 ? (x + 1 - ox) / dx : (ox - x) / -dx);
    let tMaxY = dy === 0 ? Infinity : (stepY > 0 ? (y + 1 - oy) / dy : (oy - y) / -dy);
    let tMaxZ = dz === 0 ? Infinity : (stepZ > 0 ? (z + 1 - oz) / dz : (oz - z) / -dz);
    let face = 0;
    let t = 0;
    while (t < maxDist) {
      const id = this.getTile(x, y, z);
      if (id > 0 && Tile.tiles[id] && Tile.tiles[id].material.blocksMotion) {
        const hr = new HitResult();
        hr.setTile(x, y, z, face, new Vec3(ox + dx * t, oy + dy * t, oz + dz * t));
        return hr;
      }
      if (tMaxX < tMaxY && tMaxX < tMaxZ) {
        x += stepX; t = tMaxX; tMaxX += tDeltaX; face = stepX > 0 ? 4 : 5;
      } else if (tMaxY < tMaxZ) {
        y += stepY; t = tMaxY; tMaxY += tDeltaY; face = stepY > 0 ? 0 : 1;
      } else {
        z += stepZ; t = tMaxZ; tMaxZ += tDeltaZ; face = stepZ > 0 ? 2 : 3;
      }
    }
    const hr = new HitResult();
    return hr;
  }

  extinguishFire(x, y, z, face) { /* no-op in port */ }
}

// Tile base — VERIFIED (Entry 11: Tile.h, Tile.cpp)
class Tile {
  constructor(id, tex, material) {
    if (typeof tex === 'undefined') {
      // Tile(id, material) form
      this.id = id;
      this.material = arguments[1];
      this.tex = 1;
    } else {
      this.id = id;
      this.tex = tex;
      this.material = material;
    }
    this.category = -1;
    this.gravity = 1.0;
    this.friction = 0.6;            // default ground friction (Entry 11)
    this.destroySpeed = 0;
    this.explosionResistance = 0;
    this.soundType = TileStatic.SOUND_NORMAL;
    // Default shape 0,0,0,1,1,1 — full 1x1x1 cube (Entry 11)
    this.xx0 = 0; this.yy0 = 0; this.zz0 = 0;
    this.xx1 = 1; this.yy1 = 1; this.zz1 = 1;
    this.renderShape = TileShape.SHAPE_BLOCK;
    this.descriptionId = '';
  }

  // Tile::init() — VERIFIED (Entry 11)
  init() {
    TileStatic.tiles[this.id] = this;
    this.setShape(this.xx0, this.yy0, this.zz0, this.xx1, this.yy1, this.zz1);
    TileStatic.solid[this.id] = this.isSolidRender() ? 1 : 0;
    TileStatic.lightBlock[this.id] = this.isSolidRender() ? 255 : 0;
    TileStatic.translucent[this.id] = this.material.blocksLight ? 0 : 1;
    return this;
  }

  // Builder helpers — VERIFIED (Entry 11)
  setDestroyTime(d) {
    this.destroySpeed = d;
    if (this.explosionResistance < d * 5) this.explosionResistance = d * 5;
    return this;
  }
  setExplodeable(r) {
    this.explosionResistance = r * 3;
    return this;
  }
  setSoundType(s) { this.soundType = s; return this; }
  setCategory(c) { this.category = c; return this; }
  setDescriptionId(d) { this.descriptionId = d; return this; }
  setLightEmission(f) {
    TileStatic.lightEmission[this.id] = Math.floor(LevelConst.MAX_BRIGHTNESS * f);
    return this;
  }
  setLightBlock(i) { TileStatic.lightBlock[this.id] = i; return this; }
  setTicking(t) { TileStatic.shouldTick[this.id] = t ? 1 : 0; return this; }

  // Tile::isSolidRender — VERIFIED (Entry 11): default true
  isSolidRender() { return true; }
  // Tile::isCubeShaped — VERIFIED (Entry 11): default true
  isCubeShaped() { return true; }
  // Tile::getRenderShape — VERIFIED (Entry 11): default SHAPE_BLOCK
  getRenderShape() { return this.renderShape; }

  // Tile::getTexture(face) — VERIFIED (Entry 11): default returns this.tex
  getTexture(face, data) { return this.tex; }

  // Tile::shouldRenderFace — VERIFIED (Entry 11)
  shouldRenderFace(level, x, y, z, face) {
    if (face === 0 && y === -1) return false;
    if (face === 2 && z === -1) return false;
    if (face === 3 && z === 256) return false;
    if (face === 4 && x === -1) return false;
    if (face === 5 && x === 256) return false;
    if (face === 0 && this.yy0 > 0) return true;
    if (face === 1 && this.yy1 < 1) return true;
    if (face === 2 && this.zz0 > 0) return true;
    if (face === 3 && this.zz1 < 1) return true;
    if (face === 4 && this.xx0 > 0) return true;
    if (face === 5 && this.xx1 < 1) return true;
    const t = Tile.tiles[level.getTile(x, y, z)];
    if (!t) return true;
    if (face === 1 && t.id === 78) return false;  // topSnow skip
    return !t.isSolidRender();
  }

  // Tile::getAABB / getTileAABB — VERIFIED (Entry 11)
  getAABB(level, x, y, z) {
    return new AABB(x + this.xx0, y + this.yy0, z + this.zz0,
                    x + this.xx1, y + this.yy1, z + this.zz1);
  }

  // Tile::setShape — VERIFIED (Entry 11)
  setShape(x0, y0, z0, x1, y1, z1) {
    this.xx0 = x0; this.yy0 = y0; this.zz0 = z0;
    this.xx1 = x1; this.yy1 = y1; this.zz1 = z1;
    return this;
  }

  // Tile::getDestroyProgress(player) — VERIFIED (Entry 11)
  // if destroySpeed < 0: 0; if !canDestroy: 1/destroySpeed/100; else (getDestroySpeed/destroySpeed)/30
  getDestroyProgress(player) {
    if (this.destroySpeed < 0) return 0;
    if (!player.canDestroy(this)) return 1 / this.destroySpeed / 100.0;
    return (player.getDestroySpeed(this) / this.destroySpeed) / 30.0;
  }

  // Tile::getResource / getResourceCount — VERIFIED (Entry 11): default drop self
  getResource(data, random) { return this.id; }
  getResourceCount(random) { return 1; }
  getSpawnResourcesAuxValue(data) { return 0; }

  // Tile::use / playerDestroy / canSurvive — VERIFIED (Entry 11)
  use(level, x, y, z, player) { return false; }
  playerDestroy(level, player, x, y, z, data) {
    this.spawnResources(level, x, y, z, data);
  }
  canSurvive(level, x, y, z) { return true; }

  // Tile::spawnResources — VERIFIED (Entry 11): drop the resource (simplified)
  spawnResources(level, x, y, z, data) {
    // In our minimal port we just record the drop; item entity spawning is omitted.
  }

  // Tile::getTickDelay — VERIFIED (Entry 11): default 10
  getTickDelay() { return 10; }

  // Tile::getExplosionResistance — VERIFIED (Entry 11)
  getExplosionResistance(source) { return this.explosionResistance / 5.0; }

  mayPick() { return true; }
  mayPlace(level, x, y, z) {
    const t = level.getTile(x, y, z);
    return t === 0 || Tile.tiles[t].material.isReplaceable;
  }

  neighborChanged(level, x, y, z, type) { /* default no-op */ }

  tick(level, x, y, z, random) { /* default no-op */ }
}

// Simple PRNG for level gen (per-chunk seeded)
class Random {
  constructor(seed) { this.seed = (seed || 1) >>> 0; this.state = this.seed; }
  nextInt(n) {
    this.state = (Math.imul(this.state, 1103515245) + 12345) & 0x7fffffff;
    if (n === undefined) return this.state;
    return this.state % n;
  }
  nextFloat() { return this.nextInt(1000000) / 1000000; }
  setSeed(s) { this.seed = s >>> 0; this.state = this.seed; }
}

// PerlinNoise — simple noise generator (approximation, UNVERIFIED — MCPE uses a
// specific PerlinNoise class; the worldgen output won't match MCPE seed-for-seed
// but the algorithm structure is preserved.)
class PerlinNoise {
  constructor(random, octaves) {
    this.octaves = octaves;
    this.perm = new Uint8Array(512);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = random.nextInt(i + 1);
      const tmp = p[i]; p[i] = p[j]; p[j] = tmp;
    }
    for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
  }
  fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  lerp(a, b, t) { return a + t * (b - a); }
  grad(hash, x, y, z) {
    const h = hash & 15;
    const u = h < 8 ? x : y;
    const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
    return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
  }
  noise3(x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = this.fade(x), v = this.fade(y), w = this.fade(z);
    const A = this.perm[X] + Y, AA = this.perm[A] + Z, AB = this.perm[A + 1] + Z;
    const B = this.perm[X + 1] + Y, BA = this.perm[B] + Z, BB = this.perm[B + 1] + Z;
    return this.lerp(
      this.lerp(
        this.lerp(this.grad(this.perm[AA], x, y, z), this.grad(this.perm[BA], x - 1, y, z), u),
        this.lerp(this.grad(this.perm[AB], x, y - 1, z), this.grad(this.perm[BB], x - 1, y - 1, z), u),
        v),
      this.lerp(
        this.lerp(this.grad(this.perm[AA + 1], x, y, z - 1), this.grad(this.perm[BA + 1], x - 1, y, z - 1), u),
        this.lerp(this.grad(this.perm[AB + 1], x, y - 1, z - 1), this.grad(this.perm[BB + 1], x - 1, y - 1, z - 1), u),
        v),
      w);
  }
  // PerlinNoise::getRegion — simplified (Entry 13: getHeights uses getRegion on noise grid)
  // returns an array of size xSize*ySize*zSize of noise values roughly in [-1, 1].
  getRegion(buffer, x, y, z, xSize, ySize, zSize, sx, sy, sz) {
    const total = xSize * ySize * zSize;
    if (!buffer || buffer.length < total) buffer = new Float32Array(total);
    let p = 0;
    for (let i = 0; i < xSize; i++)
      for (let j = 0; j < ySize; j++)
        for (let k = 0; k < zSize; k++) {
          let sum = 0, amp = 1, max = 0;
          let cx = (x + i) * sx, cy = (y + j) * sy, cz = (z + k) * sz;
          for (let o = 0; o < this.octaves; o++) {
            sum += this.noise3(cx, cy, cz) * amp;
            max += amp;
            cx *= 2; cy *= 2; cz *= 2;
            amp *= 0.5;
          }
          buffer[p++] = sum / max;
        }
    return buffer;
  }
  // Single sample for trees etc.
  getValue(x, z) {
    return this.noise3(x, 0, z);
  }
}

// LevelGen — port of RandomLevelSource (Entry 13)
class LevelGen {
  constructor(level) {
    this.level = level;
    this.random = new Random(level.seed);
    // Order VERIFIED (Entry 13: RandomLevelSource constructor)
    this.lperlinNoise1 = new PerlinNoise(this.random, 16);
    this.lperlinNoise2 = new PerlinNoise(this.random, 16);
    this.perlinNoise1  = new PerlinNoise(this.random, 8);
    this.perlinNoise2  = new PerlinNoise(this.random, 4);
    this.perlinNoise3  = new PerlinNoise(this.random, 4);
    this.scaleNoise   = new PerlinNoise(this.random, 10);
    this.depthNoise   = new PerlinNoise(this.random, 16);
    this.forestNoise  = new PerlinNoise(this.random, 8);
    // SNOW constants — VERIFIED (Entry 13)
    this.SNOW_CUTOFF = 0.5;
    this.SNOW_SCALE  = 0.3;
    this.buffer = new Float32Array(1024);
    this.sandBuffer = new Float32Array(16 * 16);
    this.gravelBuffer = new Float32Array(16 * 16);
    this.depthBuffer = new Float32Array(16 * 16);
  }

  // RandomLevelSource::getChunk — VERIFIED (Entry 13): per-chunk RNG seed
  generateChunk(cx, cz) {
    const chunkRandom = new Random(0);
    chunkRandom.setSeed((Math.imul(cx, 341872712) + Math.imul(cz, 132899541)) ^ this.level.seed);
    const chunk = this.level.getChunk(cx, cz);
    this.prepareHeights(cx, cz, chunk.blocks, chunkRandom);
    this.buildSurfaces(cx, cz, chunk.blocks, chunkRandom);
    chunk.recalcHeightmap();
    chunk.dirty = true;
    return chunk;
  }

  // RandomLevelSource::prepareHeights — VERIFIED (Entry 13)
  // waterHeight = DEPTH - 64 = 64. CHUNK_WIDTH=4, CHUNK_HEIGHT=8 (noise grid cells)
  // val > 0 → rock(1); below y=64 → calmWater(9) or ice(79) if cold; else air(0)
  prepareHeights(xOffs, zOffs, blocks, chunkRandom) {
    const CHUNK_WIDTH = 4;       // Entry 13: noise grid X cell size
    const CHUNK_HEIGHT = 8;      // Entry 13: noise grid Y cell size
    const xChunks = 16 / CHUNK_WIDTH;          // 4
    const waterHeight = LevelConst.DEPTH - 64; // 64
    const xSize = xChunks + 1;                  // 5
    const ySize = (128 / CHUNK_HEIGHT) + 1;     // 17
    const zSize = xChunks + 1;                  // 5
    this.buffer = this.getHeights(this.buffer, xOffs * xChunks, 0, zOffs * xChunks, xSize, ySize, zSize);

          let s1 = this.buffer[((xc + 0) * zSize + (zc + 1)) * ySize + (yc + 0)];
          let s2 = this.buffer[((xc + 1) * zSize + (zc + 0)) * ySize + (yc + 0)];
          let s3 = this.buffer[((xc + 1) * zSize + (zc + 1)) * ySize + (yc + 0)];

  // RandomLevelSource::getHeights — VERIFIED (Entry 13)
  getHeights(buffer, x, y, z, xSize, ySize, zSize) {
    const s = 1 * 684.412;        // VERIFIED height scale
    const hs = 1 * 684.412;
    const sr = this.scaleNoise.getRegion(null, x, z, 0, xSize, zSize, 1, 1.121, 1.121);
    const dr = this.depthNoise.getRegion(null, x, z, 0, xSize, zSize, 1, 200.0, 200.0);
    const pnr = this.perlinNoise1.getRegion(null, x, y, z, xSize, ySize, zSize, s / 80.0, hs / 160.0, s / 80.0);
    const ar = this.lperlinNoise1.getRegion(null, x, y, z, xSize, ySize, zSize, s, hs, s);
    const br = this.lperlinNoise2.getRegion(null, x, y, z, xSize, ySize, zSize, s, hs, s);

    let p = 0, pp = 0;
    const wScale = 16 / xSize;
    for (let xx = 0; xx < xSize; xx++) {
      const xp = xx * wScale + (wScale >> 1);
      for (let zz = 0; zz < zSize; zz++) {
        const zp = zz * wScale + (wScale >> 1);
        const temperature = 0.5;
        const downfall = 0.3 * temperature;
        let dd = 1 - downfall;
        dd = dd * dd; dd = dd * dd; dd = 1 - dd;
        let scale = (sr[pp] + 256.0) / 512;
        scale *= dd; if (scale > 1) scale = 1;
        let depth = dr[pp] / 8000.0;
        if (depth < 0) depth = -depth * 0.3;
        depth = depth * 3 - 2;
        if (depth < 0) {
          depth = depth / 2;
          if (depth < -1) depth = -1;
          depth = depth / 1.4;
          depth /= 2;
          scale = 0;
        } else {
          if (depth > 1) depth = 1;
          depth = depth / 8;
        }
        if (scale < 0) scale = 0;
        scale = scale + 0.5;
        depth = depth * ySize / 16;
        const yCenter = ySize / 2 + depth * 4;
        pp++;
        for (let yy = 0; yy < ySize; yy++) {
          let val = 0;
          let yOffs = (yy - yCenter) * 12 / scale;
          if (yOffs < 0) yOffs *= 4;
          const bb = ar[p] / 512;
          const cc = br[p] / 512;
          const v = (pnr[p] / 10 + 1) / 2;
          if (v < 0) val = bb;
          else if (v > 1) val = cc;
          else val = bb + (cc - bb) * v;
          val -= yOffs;
          if (yy > ySize - 4) {
            const slide = (yy - (ySize - 4)) / (4 - 1.0);
            val = val * (1 - slide) + -10 * slide;
          }
          buffer[p] = val;
          p++;

      }
    }
    return buffer;
  }

  // RandomLevelSource::buildSurfaces — VERIFIED (Entry 13)
  // Bedrock y<=random(5); top block grass (or sand at shore); below dirt; sand runs add sandstone
  buildSurfaces(xOffs, zOffs, blocks, chunkRandom) {
    const waterHeight = LevelConst.DEPTH - 64;        // 64
    const s = 1 / 32.0;
    this.perlinNoise2.getRegion(this.sandBuffer, xOffs * 16, zOffs * 16, 0, 16, 16, 1, s, s, 1);
    this.perlinNoise2.getRegion(this.gravelBuffer, xOffs * 16, 109.0134, zOffs * 16, 16, 1, 16, s, 1, s);
    this.perlinNoise3.getRegion(this.depthBuffer, xOffs * 16, zOffs * 16, 0, 16, 16, 1, s * 2, s * 2, s * 2);
    const grassId = Tile.grass.id;
    const dirtId = Tile.dirt.id;
    const rockId = Tile.rock.id;
    const sandId = Tile.sand.id;
    const gravelId = Tile.gravel.id;
    const sandStoneId = Tile.sandStone.id;
    const calmWaterId = Tile.calmWater.id;
    const iceId = Tile.ice.id;
    const bedrockId = Tile.unbreakable.id;
    for (let x = 0; x < 16; x++) {
      for (let z = 0; z < 16; z++) {
        const temp = 0.5;
        const sandVal = this.sandBuffer[x + z * 16] + chunkRandom.nextFloat() * 0.2;
        const gravelVal = this.gravelBuffer[x + z * 16] + chunkRandom.nextFloat() * 0.2;
        let runDepth = Math.floor(this.depthBuffer[x + z * 16] / 3 + 3 + chunkRandom.nextFloat() * 0.25);
        let run = -1;
        let top = grassId;
        let material = dirtId;
        for (let y = 127; y >= 0; y--) {
          const offs = (x << 11) | (z << 7) | y;
          if (y <= chunkRandom.nextInt(5)) {
            blocks[offs] = bedrockId;
          } else {
            const old = blocks[offs];
            if (old === 0) {
              run = -1;
            } else if (old === rockId) {
              if (run === -1) {
                if (runDepth <= 0) {
                  top = 0;
                  material = rockId;
                } else if (y >= waterHeight - 4 && y <= waterHeight + 1) {
                  top = grassId; material = dirtId;
                  if (gravelVal > 3) { top = 0; material = gravelId; }
                  if (sandVal > 0)   { top = sandId; material = sandId; }
                }
                if (y < waterHeight && top === 0) {
                  if (temp < 0.15) top = iceId;
                  else top = calmWaterId;
                }
                run = runDepth;
                if (y >= waterHeight - 1) blocks[offs] = top;
                else blocks[offs] = material;
              } else if (run > 0) {
                run--;
                blocks[offs] = material;
                if (run === 0 && material === sandId) {
                  run = chunkRandom.nextInt(4);
                  material = sandStoneId;
                }
              }
            }
          }
        }
      }
    }
  }

  // Simplified ore + tree placement (Entry 13: postProcess). We don't reproduce
  // the exact ore veins but do place a few ores + a tree per chunk for variety.
  postProcessChunk(cx, cz) {
    const xo = cx * 16, zo = cz * 16;
    const r = this.random;
    r.setSeed((Math.imul(cx, 341872712) + Math.imul(cz, 132899541)) ^ this.level.seed);
    // Coal (20 veins size 16, full y range)
    for (let i = 0; i < 20; i++) {
      const x = xo + r.nextInt(16), y = r.nextInt(128), z = zo + r.nextInt(16);
      this.placeOreVein(x, y, z, Tile.coalOre.id, 16);
    }
    // Iron (20 veins size 8, y 0..63)
    for (let i = 0; i < 20; i++) {
      const x = xo + r.nextInt(16), y = r.nextInt(64), z = zo + r.nextInt(16);
      this.placeOreVein(x, y, z, Tile.ironOre.id, 8);
    }
    // Gold (2 veins size 8, y 0..31)
    for (let i = 0; i < 2; i++) {
      const x = xo + r.nextInt(16), y = r.nextInt(32), z = zo + r.nextInt(16);
      this.placeOreVein(x, y, z, Tile.goldOre.id, 8);
    }
    // Diamond (1 vein size 7, y 0..15)
    {
      const x = xo + r.nextInt(16), y = r.nextInt(16), z = zo + r.nextInt(16);
      this.placeOreVein(x, y, z, Tile.diamondOre.id, 7);
    }
    // Trees: a few per chunk
    const treeCount = 2 + r.nextInt(3);
    for (let i = 0; i < treeCount; i++) {
      const x = xo + r.nextInt(16);
      const z = zo + r.nextInt(16);
      const y = this.level.getTopSolidBlock(x, z);
      if (y > 0 && y < 120) this.placeTree(x, y, z, r);
    }
    // Flowers
    for (let i = 0; i < 2; i++) {
      const x = xo + r.nextInt(16), z = zo + r.nextInt(16);
      const y = this.level.getTopSolidBlock(x, z);
      if (y > 0 && this.level.getTile(x, y, z) === 0 && this.level.getTile(x, y - 1, z) === Tile.grass.id) {
        this.level.setTile(x, y, z, Tile.flower.id);
      }
    }
  }

  placeOreVein(x, y, z, id, size) {
    for (let i = 0; i < size; i++) {
      const dx = Math.floor(this.random.nextFloat() * 3) - 1;
      const dy = Math.floor(this.random.nextFloat() * 3) - 1;
      const dz = Math.floor(this.random.nextFloat() * 3) - 1;
      const tx = x + dx, ty = y + dy, tz = z + dz;
      if (ty >= 0 && ty < 128 && this.level.getTile(tx, ty, tz) === Tile.rock.id) {
        this.level.setTileNoUpdate(tx, ty, tz, id);
      }
    }
  }

  placeTree(x, y, z, r) {
    const h = 4 + r.nextInt(3);
    for (let i = 0; i < h; i++) {
      if (y + i < 128) this.level.setTileNoUpdate(x, y + i, z, Tile.treeTrunk.id);
    }
    for (let dx = -2; dx <= 2; dx++) {
      for (let dz = -2; dz <= 2; dz++) {
        for (let dy = -1; dy <= 1; dy++) {
          if (Math.abs(dx) + Math.abs(dz) + Math.abs(dy) > 3) continue;
          const lx = x + dx, ly = y + h - 1 + dy, lz = z + dz;
          if (lx >= 0 && lx < 256 && lz >= 0 && lz < 256 && ly < 128) {
            if (this.level.getTile(lx, ly, lz) === 0) {
              this.level.setTileNoUpdate(lx, ly, lz, Tile.leaves.id);
            }
          }
        }
      }
    }
  }

  generateAll() {
    for (let cx = 0; cx < 16; cx++) {
      for (let cz = 0; cz < 16; cz++) {
        this.generateChunk(cx, cz);
      }
    }
    for (let cx = 0; cx < 16; cx++) {
      for (let cz = 0; cz < 16; cz++) {
        this.postProcessChunk(cx, cz);
      }
    }
    for (let cx = 0; cx < 16; cx++) {
      for (let cz = 0; cz < 16; cz++) {
        const c = this.level.getChunk(cx, cz);
        c.recalcHeightmap();
        c.dirty = true;
      }
    }
  }
}

// Entity base — VERIFIED (Entry 1: Entity.cpp)
class Entity {
  constructor(level) {

    this.xd = 0; this.yd = 0; this.zd = 0;

    this.verticalCollision = false;

  // Entity::moveRelative — VERIFIED (Entry 6: Entity.cpp:575-590)
  // Local (xa,za) input → world (xd,zd) using yRot rotation.
  moveRelative(xa, za, speed) {
    let dist = Math.sqrt(xa * xa + za * za);
    if (dist < 0.01) return;
    if (dist < 1) dist = 1;
    dist = speed / dist;

    const cos_ = Math.cos(this.yRot * Math.PI / 180);

    let newY = ya;

    if (ya !== newY) {

    }
    this.bb.move(0, newY, 0);

    if (xa !== newX) this.xd = 0;

    const y0 = Math.floor(queryBox.y0), y1 = Math.floor(queryBox.y1);
    const z0 = Math.floor(queryBox.z0), z1 = Math.floor(queryBox.z1);
    for (let x = x0; x <= x1; x++) {
      for (let y = y0; y <= y1; y++) {

    const y0 = Math.floor(test.y0), y1 = Math.floor(test.y1);

  }
  isInWater() {
    return this.level.getMaterial(Math.floor(this.x), Math.floor(this.y + this.bbHeight * 0.5), Math.floor(this.z)) === Materials.water;
  }
  isInLava() {
    return this.level.getMaterial(Math.floor(this.x), Math.floor(this.y + this.bbHeight * 0.5), Math.floor(this.z)) === Materials.lava;
  }

  // Entity::baseTick — VERIFIED (Entry 1)
  baseTick() {

      const tmp = this.walkDist;
      this.calculateFlight(xa, ya, za);
      this.fallDistance = 0;
      this.yd = 0;
      // Entity::move with noPhysics
      Entity.prototype.move.call(this, this.flyX, this.flyY, this.flyZ);
      this.onGround = true;
      this.walkDist = tmp;
    } else {
      // AUTOJUMP PATH
      if (this.autoJumpTime > 0) {
        this.autoJumpTime--;
        this.input.jumping = true;       // force jump key for the autoJump tick
      }
      const prevX = this.x, prevZ = this.z;
      Entity.prototype.move.call(this, xa, ya, za);
      const newX = this.x, newZ = this.z;
      // Autojump heuristic — VERIFIED (Entry 6)
      if (this.autoJumpTime <= 0 && this.autoJumpEnabled) {
        let jump = false;
        // Trigger when crossing the middle of a tile (crossed into a new half-tile)
        if (Math.floor(prevX * 2.0) !== Math.floor(newX * 2.0) ||
            Math.floor(prevZ * 2.0) !== Math.floor(newZ * 2.0)) {
          const dist = Math.sqrt(xa * xa + za * za);
          if (dist > 0) {
            const xx = Math.floor(this.x + xa / dist);
            const zz = Math.floor(this.z + za / dist);
            const yFloor = Math.floor(this.y);
            const tileId = this.level.getTile(xx, yFloor - 1, zz);
            // Need: solid at y-1 (step), air at y and y+1 (headroom), isJumpable
            jump = (this.isSolidTile(xx, yFloor - 1, zz) &&
                   !this.isSolidTile(xx, yFloor, zz) &&
                   !this.isSolidTile(xx, yFloor + 1, zz) &&
                   isJumpable(tileId));

        if (jump) this.autoJumpTime = 1;        // forces input->jumping=true for 1 tick

// File-scope isJumpable — VERIFIED (Entry 6: LocalPlayer.cpp:36-44)
// Autojump blacklist: fences, fence gates, half slabs, trapdoors, signs, wall signs, stairs.
function isJumpable(tileId) {
  if (tileId === Tile.fence.id)         return false;
  if (tileId === Tile.fenceGate.id)     return false;
  if (tileId === Tile.stoneSlabHalf.id) return false;
  if (tileId === Tile.trapdoor.id)      return false;
  if (tileId === Tile.sign.id)          return false;
  if (tileId === Tile.wallSign.id)      return false;
  const t = Tile.tiles[tileId];
  if (!t) return false;
  return t.getRenderShape() !== TileShape.SHAPE_STAIRS;
}

  static linearTransform(value, deadZone, scale = 1, limit1 = false) {
    const deadSigned = value >= 0 ? deadZone : -deadZone;
    if (Math.abs(deadSigned) >= Math.abs(value)) return 0;
    let ret = (value - deadSigned) * scale;
    if (limit1 && Math.abs(ret) > 1) ret /= Math.abs(ret);
    return ret;
  }
}

    } else {

    }

    this.visible = true;
    this.selected = false;
    this._currentlyDown = false;
  }
  // Button::clicked — VERIFIED (Entry 17)
  clicked(mc, mx, my) {
    return this.active && mx >= this.x && my >= this.y && mx < this.x + this.width && my < this.y + this.height;
  }

  }

  released(mx, my) { this._currentlyDown = false; }

  render(ctx, xm, ym) {

    this.renderFace(ctx, xm, ym);

  // For our DOM/canvas port, we draw colored rectangles mimicking the texture.
  renderBg(ctx, xm, ym) {
    const yImage = this.getYImage(this.selected || this.hovered(ctx, xm, ym));
    // yImage 0 = disabled (gray), 1 = normal (medium gray), 2 = hovered (lighter gray)
    const colors = ['#5a5a5a', '#6a6a6a', '#7c7c7c'];
    ctx.fillStyle = colors[yImage];

  // 0xffa0a0a0 disabled, 0xe0e0e0 normal, 0xffffa0 hovered
  renderFace(ctx, xm, ym) {
    const font = this.minecraft.font;
    let color;
    if (!this.active) color = '#a0a0a0';        // VERIFIED: 0xffa0a0a0 (gray)
    else if (this.hovered(ctx, xm, ym) || this.selected) color = '#ffffa0';     // VERIFIED: 0xffffa0 (yellow)
    else color = '#e0e0e0';                      // VERIFIED: 0xe0e0e0 (light gray)
    // Text Y offset: y + (height - 8) / 2 (centers 8-px font)
    font.drawCentered(ctx, this.msg, this.x + this.width / 2, this.y + (this.height - 8) / 2, color);

}

// Timer — VERIFIED (Entry 18: Timer.h:1-122)
class Timer {
  constructor(ticksPerSecond) {
    this.ticksPerSecond = ticksPerSecond;
    this.adjustTime = 1.0;
    this.timeScale = 1.0;
    this.passedTime = 0;
    this.lastMs = performance.now();
    this.lastMsSysTime = this.lastMs;
    this.lastTime = this.lastMs / 1000.0;
    this.MAX_TICKS_PER_UPDATE = 10;       // VERIFIED: max 10 ticks per update
    this.ticks = 0;
    this.a = 0;
  }
  // Timer::advanceTime — VERIFIED (Entry 18)
  advanceTime() {
    const nowMs = performance.now();
    let passedMs = nowMs - this.lastMs;
    let msSysTime = nowMs;
    if (passedMs > 1000) {
      let passedMsSysTime = msSysTime - this.lastMsSysTime;
      if (passedMsSysTime === 0) { passedMs = 1; passedMsSysTime = 1; }
      const adjustTimeT = passedMs / passedMsSysTime;
      this.adjustTime += (adjustTimeT - this.adjustTime) * 0.2;    // VERIFIED: 20% lerp
      this.lastMs = nowMs;
      this.lastMsSysTime = msSysTime;
    }
    if (passedMs < 0) { this.lastMs = nowMs; this.lastMsSysTime = msSysTime; }
    const now = msSysTime / 1000.0;
    let passedSeconds = (now - this.lastTime) * this.adjustTime;
    this.lastTime = now;
    if (passedSeconds < 0) passedSeconds = 0;
    if (passedSeconds > 1) passedSeconds = 1;     // VERIFIED: clamp to 1 sec
    this.passedTime += passedSeconds * this.timeScale * this.ticksPerSecond;
    this.ticks = Math.floor(this.passedTime);
    this.passedTime -= this.ticks;
    if (this.ticks > this.MAX_TICKS_PER_UPDATE) this.ticks = this.MAX_TICKS_PER_UPDATE;
    this.a = this.passedTime;
  }
}

  }

  // Render the current screen to the DOM overlay
  renderOverlay(ov) {
    if (!this.screen) { ov.innerHTML = ''; return; }
    ov.innerHTML = '';
    const canvas = document.createElement('canvas');
    canvas.width = this.width; canvas.height = this.height;
    canvas.style.width = '100%'; canvas.style.height = '100%';
    ov.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const mouse = { x: 0, y: 0 };
    canvas.addEventListener('mousemove', (e) => {
      const r = canvas.getBoundingClientRect();
      mouse.x = (e.clientX - r.left) * canvas.width / r.width;
      mouse.y = (e.clientY - r.top) * canvas.height / r.height;
    });
    canvas.addEventListener('mousedown', (e) => {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) * canvas.width / r.width;
      const y = (e.clientY - r.top) * canvas.height / r.height;
      this.screen.mouseClicked(x, y, 0);
    });
    canvas.addEventListener('mouseup', (e) => {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) * canvas.width / r.width;
      const y = (e.clientY - r.top) * canvas.height / r.height;
      this.screen.mouseReleased(x, y, 0);
    });
    this._overlayCanvas = canvas;
    this._overlayCtx = ctx;
    this._overlayMouse = mouse;
  }

  drawOverlay() {
    if (!this.screen || !this._overlayCtx) return;
    const ctx = this._overlayCtx;
    ctx.clearRect(0, 0, this.width, this.height);
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    this.screen.render(ctx, this._overlayMouse.x, this._overlayMouse.y, this.timer.a);
  }
}

// Tesselator — VERIFIED (Entry 15: Tesselator.cpp)
// Vertex = 24 bytes (12 pos + 8 uv + 4 color ABGR). For our Three.js port we
// use BufferGeometry with positions/uv/color attributes. GL_QUADS → 6 verts (stitch).
class Tesselator {
  constructor() {
    this.positions = [];
    this.uvs = [];
    this.colors = [];
    this._vertCount = 0;
    this._cr = 1; this._cg = 1; this._cb = 1; this._ca = 1;
  }
  begin() {
    this.positions = []; this.uvs = []; this.colors = [];
    this._vertCount = 0;
  }
  vertexUV(x, y, z, u, v) {
    this.positions.push(x, y, z);
    this.uvs.push(u, v);
    this.colors.push(this._cr, this._cg, this._cb, this._ca);
    this._vertCount++;
  }
  color(c) {
    this._cr = ((c >> 16) & 0xff) / 255;
    this._cg = ((c >> 8)  & 0xff) / 255;
    this._cb = (c & 0xff) / 255;
    this._ca = 1.0;
  }
}
Tesselator.instance = new Tesselator();

// Procedural texture atlas — generates a 256×256 atlas with 16×16 tiles,
// colored per tile id (since we don't have terrain.png).
class TextureAtlas {
  constructor() {
    this.size = 256;
    this.canvas = document.createElement('canvas');
    this.canvas.width = this.size; this.canvas.height = this.size;
    const ctx = this.canvas.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, this.size, this.size);
    for (let i = 0; i < 256; i++) {
      const tx = i & 15, ty = (i >> 4) & 15;
      const c = TextureAtlas.tileColor(i);
      ctx.fillStyle = c;
      ctx.fillRect(tx * 16, ty * 16, 16, 16);
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      for (let p = 0; p < 4; p++) {
        ctx.fillRect(tx * 16 + Math.floor(Math.sin(i + p) * 7) + 8,
                     ty * 16 + Math.floor(Math.cos(i + p) * 7) + 8, 1, 1);
      }
    }
    this.texture = new THREE.CanvasTexture(this.canvas);
    this.texture.magFilter = THREE.NearestFilter;
    this.texture.minFilter = THREE.NearestFilter;
  }
  static tileColor(i) {
    const map = {
      1:  '#7f7f7f', 2:  '#5a8a3a', 3:  '#8a6a3a', 4:  '#7f7f7f', 5:  '#b7894e',
      6:  '#5a8a3a', 7:  '#333333', 8:  '#2546b8', 9:  '#2546b8', 10: '#e85a1e',
      11: '#e85a1e', 12: '#e6d89a', 13: '#888888', 14: '#dca41a', 15: '#a89888',
      16: '#404040', 17: '#5a3a1a', 18: '#3a8a2a', 20: '#c0e0f0', 24: '#e0d0a0',
      35: '#a87a4a', 37: '#ff8040', 38: '#ff4040', 41: '#ffd700', 42: '#e8e8e8',
      45: '#a44a3a', 46: '#ff4040', 47: '#a87a4a', 48: '#5a7a5a', 49: '#1a1a2a',
      50: '#ffe040', 54: '#a87a4a', 56: '#40e0e0', 57: '#40f0f0', 58: '#8a5a3a',
      61: '#7f7f7f', 62: '#a07050', 79: '#a0d0f0', 87: '#7a3030', 89: '#ffe040',
    };
    return map[i] || '#888888';
  }
}

// Chunk (render) — VERIFIED (Entry 14: Chunk.cpp)
class ChunkRender {
  constructor(levelRenderer, cx, cz) {
    this.levelRenderer = levelRenderer;
    this.cx = cx; this.cz = cz;
    this.mesh = [null, null, null];
    this.dirty = true;
    this.inFrustum = true;
  }
  // Chunk::rebuild — VERIFIED (Entry 14: walks all blocks; for each non-air tile,
  // dispatches to TileRenderer per layer; builds 3 geometries.
  rebuild(level) {
    const layerBuf = [
      { positions: [], uvs: [], colors: [], indices: [], vc: 0 },
      { positions: [], uvs: [], colors: [], indices: [], vc: 0 },
      { positions: [], uvs: [], colors: [], indices: [], vc: 0 },
    ];
    // Face data — VERIFIED (Entry 14 face brightness): down=0.5, up=1.0, N/S=0.8, W/E=0.6
    const faces = [
      { dir: [0, -1, 0], n: [0, -1, 0], br: 0.5 },
      { dir: [0,  1, 0], n: [0,  1, 0], br: 1.0 },
      { dir: [0,  0, -1], n: [0, 0, -1], br: 0.8 },
      { dir: [0,  0,  1], n: [0, 0,  1], br: 0.8 },
      { dir: [-1, 0, 0], n: [-1, 0, 0], br: 0.6 },
      { dir: [1,  0, 0], n: [1, 0, 0], br: 0.6 },
    ];
    // VERIFIED (Entry 14): rebuild scale 1.000001; AABB padding +1 x/z, +2 top
    const S = 1.0001;
    const worldX = this.cx * 16, worldZ = this.cz * 16;
    for (let x = 0; x < 16; x++) {
      for (let z = 0; z < 16; z++) {
        for (let y = 0; y < 128; y++) {
          const id = level.getTile(worldX + x, y, worldZ + z);
          if (id === 0) continue;
          const tile = Tile.tiles[id];
          if (!tile) continue;
          const layer = tile.getRenderLayer ? tile.getRenderLayer() : 0;
          const L = layerBuf[layer] || layerBuf[0];
          const br = level.getBrightness(worldX + x, y, worldZ + z);
          for (let f = 0; f < 6; f++) {
            const face = faces[f];
            const nx = worldX + x + face.dir[0];
            const ny = y + face.dir[1];
            const nz = worldZ + z + face.dir[2];
            if (!tile.shouldRenderFace(level, nx, ny, nz, f)) continue;
            const tex = tile.getTexture(f, level.getData(worldX + x, y, worldZ + z));
            // VERIFIED (Entry 14): UV formula. Atlas 256x256, 16x16 tiles.
            const xt = (tex & 0xf) << 4;
            const yt = tex & 0xf0;
            const box = 16;
            const u0 = (xt + 0.01) / 256;
            const u1 = (xt + box - 0.01) / 256;
            const v0 = (yt + 0.01) / 256;
            const v1 = (yt + box) / 256;
            const wx = worldX + x, wy = y, wz = worldZ + z;
            const x0 = wx + tile.xx0, x1 = wx + tile.xx1 * S;
            const y0 = wy + tile.yy0, y1 = wy + tile.yy1 * S;
            const z0 = wz + tile.zz0, z1 = wz + tile.zz1 * S;
            const fb = face.br * br;
            const r = fb, g = fb, b = fb;
            const base = L.vc;
            if (f === 0) { L.positions.push(x0, y0, z0, x0, y0, z1, x1, y0, z1, x1, y0, z0); }
            else if (f === 1) { L.positions.push(x0, y1, z0, x1, y1, z0, x1, y1, z1, x0, y1, z1); }
            else if (f === 2) { L.positions.push(x0, y0, z0, x1, y0, z0, x1, y1, z0, x0, y1, z0); }
            else if (f === 3) { L.positions.push(x0, y0, z1, x0, y1, z1, x1, y1, z1, x1, y0, z1); }
            else if (f === 4) { L.positions.push(x0, y0, z0, x0, y1, z0, x0, y1, z1, x0, y0, z1); }
            else { L.positions.push(x1, y0, z0, x1, y0, z1, x1, y1, z1, x1, y1, z0); }
            L.uvs.push(u0, v1, u1, v1, u1, v0, u0, v0);
            for (let k = 0; k < 4; k++) L.colors.push(r, g, b, 1);
            L.indices.push(base, base + 1, base + 2, base, base + 2, base + 3);
            L.vc += 4;
          }
        }
      }
    }
    for (let l = 0; l < 3; l++) {
      const L = layerBuf[l];
      if (L.vc === 0) {
        if (this.mesh[l]) { this.levelRenderer.scene.remove(this.mesh[l]); this.mesh[l].geometry.dispose(); this.mesh[l] = null; }
        continue;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(L.positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(L.uvs, 2));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(L.colors, 4));
      geo.setIndex(L.indices);
      const mat = (l === 0) ? this.levelRenderer.matSolid
                  : (l === 1) ? this.levelRenderer.matCutout
                  : this.levelRenderer.matWater;
      if (this.mesh[l]) { this.levelRenderer.scene.remove(this.mesh[l]); this.mesh[l].geometry.dispose(); }
      const m = new THREE.Mesh(geo, mat);
      m.frustumCulled = true;
      this.levelRenderer.scene.add(m);
      this.mesh[l] = m;
    }
    this.dirty = false;
  }
  dispose() {
    for (let l = 0; l < 3; l++) {
      if (this.mesh[l]) {
        this.levelRenderer.scene.remove(this.mesh[l]);
        this.mesh[l].geometry.dispose();
        this.mesh[l] = null;
      }
    }
  }
}
// Tile::getRenderLayer — assign per-tile layer (Entry 14 references).
Tile.prototype.getRenderLayer = function() {
  if (this.material === Materials.water || this.material === Materials.lava) return 2;
  if (!this.isSolidRender()) return 1;
  if (this.material === Materials.leaves) return 1;
  if (this.material === Materials.glass) return 1;
  return 0;
};

// LevelRenderer — VERIFIED (Entry 15: LevelRenderer.cpp)
class LevelRenderer {
  constructor(minecraft) {
    this.minecraft = minecraft;
    this.scene = new THREE.Scene();
    this.destroyProgress = 0;
    this.atlas = new TextureAtlas();
    this.matSolid = new THREE.MeshBasicMaterial({ vertexColors: true, map: this.atlas.texture, side: THREE.FrontSide });
    this.matCutout = new THREE.MeshBasicMaterial({ vertexColors: true, map: this.atlas.texture, side: THREE.DoubleSide, transparent: true, alphaTest: 0.5 });
    this.matWater = new THREE.MeshBasicMaterial({ vertexColors: true, map: this.atlas.texture, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
    this.chunks = new Array(16 * 16).fill(null);
    this.dirtyChunks = [];
    this.playerChunkX = -999; this.playerChunkZ = -999;
  }
  setLevel(level) {
    if (level == null) {
      for (const c of this.chunks) if (c) c.dispose();
      this.chunks.fill(null);
      this.dirtyChunks = [];
      return;
    }
    this.level = level;
    for (let cx = 0; cx < 16; cx++) {
      for (let cz = 0; cz < 16; cz++) {
        const i = cz * 16 + cx;
        this.chunks[i] = new ChunkRender(this, cx, cz);
        this.dirtyChunks.push(this.chunks[i]);
      }
    }
  }
  // LevelRenderer::tileChanged — VERIFIED listener hook
  tileChanged(x, y, z) {
    const cx = x >> 4, cz = z >> 4;
    const i = cz * 16 + cx;
    if (this.chunks[i]) {
      this.chunks[i].dirty = true;
      if (this.dirtyChunks.indexOf(this.chunks[i]) < 0) this.dirtyChunks.push(this.chunks[i]);
    }
    // neighbor chunks may need rebuild for face culling
    if ((x & 15) === 0 && cx > 0 && this.chunks[cz * 16 + (cx - 1)]) {
      this.chunks[cz * 16 + (cx - 1)].dirty = true;
      if (this.dirtyChunks.indexOf(this.chunks[cz * 16 + (cx - 1)]) < 0) this.dirtyChunks.push(this.chunks[cz * 16 + (cx - 1)]);
    }
    if ((x & 15) === 15 && cx < 15 && this.chunks[cz * 16 + (cx + 1)]) {
      this.chunks[cz * 16 + (cx + 1)].dirty = true;
      if (this.dirtyChunks.indexOf(this.chunks[cz * 16 + (cx + 1)]) < 0) this.dirtyChunks.push(this.chunks[cz * 16 + (cx + 1)]);
    }
    if ((z & 15) === 0 && cz > 0 && this.chunks[(cz - 1) * 16 + cx]) {
      this.chunks[(cz - 1) * 16 + cx].dirty = true;
      if (this.dirtyChunks.indexOf(this.chunks[(cz - 1) * 16 + cx]) < 0) this.dirtyChunks.push(this.chunks[(cz - 1) * 16 + cx]);
    }
    if ((z & 15) === 15 && cz < 15 && this.chunks[(cz + 1) * 16 + cx]) {
      this.chunks[(cz + 1) * 16 + cx].dirty = true;
      if (this.dirtyChunks.indexOf(this.chunks[(cz + 1) * 16 + cx]) < 0) this.dirtyChunks.push(this.chunks[(cz + 1) * 16 + cx]);
    }
  }
  tick() {
    // Player-move > 4 blocks triggers chunk re-sort — VERIFIED (Entry 15)
    if (this.minecraft.player) {
      const px = Math.floor(this.minecraft.player.x);
      const pz = Math.floor(this.minecraft.player.z);
      if (Math.abs(px - this.playerChunkX) > 4 || Math.abs(pz - this.playerChunkZ) > 4) {
        this.playerChunkX = px; this.playerChunkZ = pz;
      }
    }
    // Rebuild dirty chunks (Entry 15: 3 nearest far + unlimited near)
    let rebuilt = 0;
    const maxPerTick = 4;
    for (let i = this.dirtyChunks.length - 1; i >= 0 && rebuilt < maxPerTick; i--) {
      const c = this.dirtyChunks[i];
      if (c.dirty) {
        c.rebuild(this.level);
        rebuilt++;
      }
      if (!c.dirty) this.dirtyChunks.splice(i, 1);
    }
  }
}

      const dy = this.minecraft.mouseHandler.dy;

      const sens = ((this.mouseSensitivity * 0.6 + 0.2) ** 3) * 8 * 4;
      this.minecraft.player.yRot += dx * sens * 0.02;
      this.minecraft.player.xRot += dy * sens * 0.02 * (this.minecraft.options.invertYMouse ? -1 : 1);
      this.minecraft.player.xRot = Math.max(-90, Math.min(90, this.minecraft.player.xRot));

      this.renderer.render(new THREE.Scene(), this.camera);

    const player = mc.player;
    const lerp = (o, n) => o + (n - o) * a;

    const eyeY = lerp(player.yOld, player.y) + player.heightOffset;
    const eyeZ = lerp(player.zOld, player.z);
    this.camera.position.set(eyeX, eyeY, eyeZ);
    this.camera.rotation.order = 'YXZ';
    this.camera.rotation.y = -player.yRot * Math.PI / 180 + Math.PI;
    this.camera.rotation.x = -player.xRot * Math.PI / 180;
    // Update pick — VERIFIED pickRange = 5.0
    mc.hitResult = mc.level.pickBlock(player, mc.gameMode.getPickRange());

class Particle {

    this.xd *= 0.98; this.yd *= 0.98; this.zd *= 0.98;
    this.yd -= this.gravity;
    this.x += this.xd; this.y += this.yd; this.z += this.zd;
    if (--this.life <= 0) this.removed = true;
  }
}

class TerrainParticle extends Particle {
  constructor(level, x, y, z, xd, yd, zd, tile, data) {
    super(level, x, y, z, xd, yd, zd);
    this.tile = tile;
    this.data = data;
  }
  init(x, y, z) { return this; }
  setPower(p) { return this; }
  scale(s) { return this; }
}

// ParticleEngine — VERIFIED (Entry 19: ParticleEngine.cpp)
class ParticleEngine {
  constructor(level) {
    this.level = level;
    this.particles = [[], [], [], []];     // 4 texture groups (Entry 19)
    this.random = new Random(0);
  }
  add(p) { this.particles[0].push(p); }
  // ParticleEngine::tick — VERIFIED (Entry 19: ParticleEngine.cpp:24-38)
  tick() {
    for (let tt = 0; tt < 4; tt++) {
      const list = this.particles[tt];
      for (let i = list.length - 1; i >= 0; i--) {
        const p = list[i];
        p.tick();
        if (p.removed) list.splice(i, 1);
      }
    }
  }
  // ParticleEngine::destroy — VERIFIED (Entry 19: ParticleEngine.cpp:100-119)
  // 18 particles per block break (3×2×3 grid, yy starts at 1), outward velocities
  destroy(x, y, z) {
    const tid = this.level.getTile(x, y, z);
    if (tid === 0) return;
    const tile = Tile.tiles[tid];
    const SD = 3;     // VERIFIED
    for (let xx = 0; xx < SD; xx++)
      for (let yy = 1; yy < SD; yy++)        // VERIFIED: yy starts at 1
        for (let zz = 0; zz < SD; zz++) {
          const xp = x + (xx + 0.5) / SD;
          const yp = y + (yy + 0.5) / SD;
          const zp = z + (zz + 0.5) / SD;
          this.add(new TerrainParticle(this.level, xp, yp, zp,
            2 * (xp - x - 0.5), 2 * (yp - y - 0.5), 2 * (zp - z - 0.5),
            tile, this.level.getData(x, y, z)).init(x, y, z));
        }
  }
  // ParticleEngine::crack — VERIFIED (Entry 19: ParticleEngine.cpp:121-139)
  // 1 particle per click, randomly placed on clicked face with 0.10 margin.
  crack(x, y, z, face) {
    const tid = this.level.getTile(x, y, z);
    if (tid === 0) return;
    const tile = Tile.tiles[tid];
    const r = 0.10;     // VERIFIED
    const xp = x + this.random.nextFloat() * ((tile.xx1 - tile.xx0) - r * 2) + r + tile.xx0;
    const yp = y + this.random.nextFloat() * ((tile.yy1 - tile.yy0) - r * 2) + r + tile.yy0;
    const zp = z + this.random.nextFloat() * ((tile.zz1 - tile.zz0) - r * 2) + r + tile.zz0;
    let px = xp, py = yp, pz = zp;
    switch (face) {
      case 0: py = y + tile.yy0 - r; break;       // DOWN
      case 1: py = y + tile.yy1 + r; break;       // UP
      case 2: pz = z + tile.zz0 - r; break;       // NORTH
      case 3: pz = z + tile.zz1 + r; break;       // SOUTH
      case 4: px = x + tile.xx0 - r; break;       // WEST
      case 5: px = x + tile.xx1 + r; break;       // EAST
    }
    const p = new TerrainParticle(this.level, px, py, pz, 0, 0, 0, tile, this.level.getData(x, y, z));
    p.init(x, y, z).setPower(0.2).scale(0.6);
    this.add(p);
  }
  setLevel(level) { this.level = level; this.particles = [[], [], [], []]; }
}

TileRegistry.init();

const canvas = document.getElementById('game');
const minecraft = new Minecraft(canvas);
minecraft.startMenuScreen = new StartMenuScreen();
minecraft.setScreen(minecraft.startMenuScreen);

// Input listeners
window.addEventListener('keydown', (e) => {
  minecraft.keys[e.keyCode] = true;
  if (minecraft.input && !e.repeat) minecraft.input.setKey(e.keyCode, true);
  if (minecraft.screen) {
    if (!e.repeat) minecraft.screen.keyPressed(e.keyCode);
  } else {
    minecraft.gui.handleKeyPressed(e.keyCode);
    if (e.keyCode === 27) minecraft.pauseGame(false);
    // Tilde → toggle creative/survival
    if (e.keyCode === 192) {
      minecraft.setIsCreativeMode(!minecraft.isCreativeMode());
      if (minecraft.player) minecraft.gameMode.initAbilities(minecraft.player.abilities);
    }
  }
  if (e.keyCode === 32 || (e.keyCode >= 37 && e.keyCode <= 40)) e.preventDefault();
});
window.addEventListener('keyup', (e) => {
  minecraft.keys[e.keyCode] = false;
  if (minecraft.input) minecraft.input.setKey(e.keyCode, false);
});
window.addEventListener('mousemove', (e) => {
  if (minecraft.mouseGrabbed && !minecraft.screen) {
    // VERIFIED (Entry 7): MODE_DELTA = raw delta
    minecraft.mouseHandler.dx += e.movementX;
    minecraft.mouseHandler.dy += e.movementY;
  }
  minecraft.mouseHandler.x = e.clientX;
  minecraft.mouseHandler.y = e.clientY;
});
window.addEventListener('mousedown', (e) => {
  if (minecraft.screen) return;
  if (e.button === 0) minecraft.buildInput._left = true;
  if (e.button === 2) minecraft.buildInput._right = true;
});
window.addEventListener('mouseup', (e) => {
  if (minecraft.screen) return;
  if (e.button === 0) minecraft.buildInput._left = false;
  if (e.button === 2) minecraft.buildInput._right = false;
});
window.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('resize', () => {
  minecraft.width = window.innerWidth;
  minecraft.height = window.innerHeight;
  if (minecraft.gameRenderer) {
    minecraft.gameRenderer.camera.aspect = minecraft.width / minecraft.height;
    minecraft.gameRenderer.camera.updateProjectionMatrix();
    minecraft.gameRenderer.renderer.setSize(minecraft.width, minecraft.height, false);
  }
  if (minecraft.screen) minecraft.screen.setSize(minecraft.width, minecraft.height);
});

canvas.addEventListener('click', () => {
  if (!minecraft.screen && !document.pointerLockElement) {
    if (canvas.requestPointerLock) canvas.requestPointerLock();
  }
});

// =============================================================================
// Main loop — VERIFIED (Entry 18): timer.advanceTime → tick × N → render
// =============================================================================

function loop() {
  if (!minecraft._running) {
    minecraft._running = true;
    minecraft.setScreen(new StartMenuScreen());
  }
  minecraft.update();
  requestAnimationFrame(loop);
}

document.getElementById('loading').classList.add('hidden');
requestAnimationFrame(loop);
